<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)" />
  
  <!-- Subtle Radial Glow -->
  <circle cx="256" cy="200" r="160" fill="#ffffff" fill-opacity="0.08" />

  <!-- Main Medical & Education Emblem -->
  <g filter="url(#shadow)">
    <!-- White Shield / Badge Container -->
    <rect x="96" y="96" width="320" height="320" rx="48" fill="#ffffff" fill-opacity="0.96" />

    <!-- Medical Plus Cross in Deep Teal -->
    <path d="M226 156 h60 v60 h60 v60 h-60 v60 h-60 v-60 h-60 v-60 h60 Z" fill="#0f766e" rx="12" />

    <!-- Stethoscope Heart Wave in Golden Amber -->
    <path d="M190 256 h30 l15 -25 l20 50 l20 -40 l15 15 h32" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Nursing Graduation Cap Top -->
    <path d="M256 126 L336 156 L256 186 L176 156 Z" fill="#047857" />
    <path d="M336 156 v24" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <circle cx="336" cy="184" r="5" fill="#f59e0b" />

    <!-- AI Sparkle Icon -->
    <path d="M370 120 L376 135 L391 141 L376 147 L370 162 L364 147 L349 141 L364 135 Z" fill="#f59e0b" />
    <path d="M142 340 L146 352 L158 356 L146 360 L142 372 L138 360 L126 356 L138 352 Z" fill="#0d9488" />
  </g>

  <!-- Bottom Label Bar -->
  <rect x="136" y="380" width="240" height="12" rx="6" fill="#0f766e" fill-opacity="0.2" />
</svg>
