<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Royal Teal to Emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="35%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Gold Foil Gradient for Officer Stars and Crest -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#021c1c" flood-opacity="0.45" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base for Android & PWA App Launcher -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Outer Circular Officer Trim -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.25" />

  <!-- Main Shield Emblem with Shadow -->
  <g filter="url(#badgeShadow)">
    <!-- Shield Outline / Body -->
    <path d="M256 70 C350 70 400 100 400 190 C400 310 256 425 256 425 C256 425 112 310 112 190 C112 100 162 70 256 70 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Medical Plus Cross (Official Nursing Officer Red & Emerald Tone) -->
    <path d="M232 150 h48 v48 h48 v48 h-48 v48 h-48 v-48 h-48 v-48 h48 Z" 
          fill="#0f766e" 
          rx="8" />

    <!-- Pure Red Emergency Center Star / Cross Accent -->
    <rect x="246" y="164" width="20" height="68" rx="4" fill="#ef4444" />
    <rect x="222" y="188" width="68" height="20" rx="4" fill="#ef4444" />

    <!-- Heartbeat ECG Pulse Wave (Gold) -->
    <path d="M165 290 h40 l15 -28 l22 56 l22 -44 l16 16 h45" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Officer Badge Laurel Leaves (Left & Right) -->
    <path d="M145 220 Q130 260 148 300 M140 240 Q120 270 142 320" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M367 220 Q382 260 364 300 M372 240 Q392 270 370 320" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Officer 3-Star Insignia on Top Header (AIIMS / NORCET Grade) -->
    <g filter="url(#glowGold)">
      <!-- Left Star -->
      <polygon points="212,106 215,114 223,114 216,119 219,127 212,122 205,127 208,119 201,114 209,114" fill="url(#goldGrad)" />
      <!-- Center Star (Larger) -->
      <polygon points="256,96 260,107 271,107 262,114 265,125 256,118 247,125 250,114 241,107 252,107" fill="url(#goldGrad)" />
      <!-- Right Star -->
      <polygon points="300,106 303,114 311,114 304,119 307,127 300,122 293,127 296,119 289,114 297,114" fill="url(#goldGrad)" />
    </g>

    <!-- Bottom Ribbon with Bold Text "NURSING OFFICER" -->
    <path d="M120 370 Q256 395 392 370 L382 410 Q256 440 130 410 Z" fill="#042f2e" stroke="url(#goldGrad)" stroke-width="3" />
    
    <text x="256" y="394" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20" 
          font-weight="900" 
          fill="#fef08a" 
          text-anchor="middle" 
          letter-spacing="2.5">
      NURSING OFFICER
    </text>
  </g>

  <!-- Sparkle AI / High-Rank Accent Top Right -->
  <path d="M430 80 L436 96 L452 102 L436 108 L430 124 L424 108 L408 102 L424 96 Z" fill="url(#goldGrad)" />
  <path d="M80 410 L84 420 L94 424 L84 428 L80 438 L76 428 L66 424 L76 420 Z" fill="#2dd4bf" />
</svg>

