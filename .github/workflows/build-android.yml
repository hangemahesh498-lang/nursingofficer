name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android Bundle (.aab) & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets & Sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Generate Release Keystore Automatically
        run: |
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
            -storepass "NursingApp@2025" -keypass "NursingApp@2025" \
            -dname "CN=Nursing Officer Prep, OU=Education, O=Nursing Officer Academy, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Update Gradle Properties with Keystore Credentials
        run: |
          echo "MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=upload" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=NursingApp@2025" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=NursingApp@2025" >> android/gradle.properties

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab) for Google Play
        working-directory: android
        run: ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Build Release APK (.apk) for Direct Mobile Testing
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nursing-Officer-Google-Play-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nursing-Officer-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Keystore Backup (Keep Safe for Future Updates)
        uses: actions/upload-artifact@v4
        with:
          name: Nursing-Officer-Upload-Keystore
          path: android/app/upload-keystore.jks
          retention-days: 30
