name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (preventing the 7-day inactivity pause)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not configured in repository secrets!"
            exit 1
          fi

          # Clean URL trailing slashes if present
          CLEAN_URL="${SUPABASE_URL%/}"
          TARGET_URL="${CLEAN_URL}/rest/v1/"

          echo "Pinging: $TARGET_URL"

          # Perform API call with anon key if provided
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X GET "$TARGET_URL" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --connect-timeout 15 \
              --max-time 30)
          else
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X GET "$TARGET_URL" \
              --connect-timeout 15 \
              --max-time 30)
          fi

          echo "Supabase Response Status Code: $HTTP_STATUS"

          # Status 200, 204, or 401/404 means the server and postgres instance responded and are awake!
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "✅ SUCCESS: Supabase project is active and awake! (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ WARNING: Received status code $HTTP_STATUS. Please check your Supabase project status."
          fi
