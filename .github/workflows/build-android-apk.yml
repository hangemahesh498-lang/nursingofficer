Create or replace the GitHub Actions workflow file:

`.github/workflows/android-build.yml`

Use the following workflow:

```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Java version
        run: |
          java -version
          javac -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Gradle environment
        working-directory: android
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          ls -lah android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nursing-officer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```

IMPORTANT:

Do not only create this workflow file. First inspect the entire Android project and make sure it is compatible with Java 21.

Check:

* `android/build.gradle`
* `android/app/build.gradle`
* `android/settings.gradle`
* `android/gradle.properties`
* `android/gradle/wrapper/gradle-wrapper.properties`
* `package.json`
* Capacitor Android version
* Android Gradle Plugin version
* Gradle version
* compileSdk
* targetSdk
* sourceCompatibility
* targetCompatibility

If the project currently specifies Java 17 while the installed Capacitor/Android dependencies require Java 21, update the Android configuration consistently to Java 21.

For example, where appropriate, configure:

```gradle
compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
}
```

Do not blindly add duplicate configurations. Inspect the existing files first and modify the existing configuration cleanly.

Also check whether Kotlin is being used. If Kotlin JVM target is configured, make it compatible with Java 21 as well.

Do not downgrade Capacitor or Android dependencies unless the existing dependency versions are genuinely incompatible with Java 21.

Do not use:

`npm audit fix --force`

because it may introduce breaking changes.

After modifying the project, verify locally/in the build environment:

```bash
npm ci
npm run build
npx cap sync android
cd android
./gradlew --version
./gradlew assembleDebug --stacktrace
```

The final objective is:

`android/app/build/outputs/apk/debug/app-debug.apk`

must be generated successfully.

Preserve the existing Nursing Officer application's UI, features, navigation, authentication, questions, admin functionality, database integration and other application logic.

Only make changes necessary for Android/GitHub Actions build compatibility.

If another error appears after fixing the Java 21 issue, continue diagnosing and fixing the next compatibility problem rather than stopping.

At the end, summarize exactly which files were changed and why.

