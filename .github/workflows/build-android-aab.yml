name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Generate App Launcher Icons & Android Assets
        run: npm run generate-icons

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one or more signing secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          sed -i "s/MYAPP_UPLOAD_STORE_PASSWORD=CHANGE_ME/MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD/" android/gradle.properties
          sed -i "s/MYAPP_UPLOAD_KEY_ALIAS=upload/MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS/" android/gradle.properties
          sed -i "s/MYAPP_UPLOAD_KEY_PASSWORD=CHANGE_ME/MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD/" android/gradle.properties

          test -f android/app/upload-keystore.jks

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Gradle environment
        working-directory: android
        run: ./gradlew --version

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          ls -lah android/app/build/outputs/bundle/release/
          test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Rename AAB
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab              android/app/build/outputs/bundle/release/Nursing-Officer-Play-Store.aab

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nursing-Officer-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/Nursing-Officer-Play-Store.aab
          if-no-files-found: error
