name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Generate App Launcher Icons & Android Assets
        run: npm run generate-icons

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using user-provided repository secrets for signing..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            sed -i "s/MYAPP_UPLOAD_STORE_PASSWORD=.*/MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD/" android/gradle.properties
            sed -i "s/MYAPP_UPLOAD_KEY_ALIAS=.*/MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS/" android/gradle.properties
            sed -i "s/MYAPP_UPLOAD_KEY_PASSWORD=.*/MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD/" android/gradle.properties
          else
            echo "No GitHub secrets provided. Automatically generating high-security release keystore on the fly..."
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
              -storepass "NursingApp@2025" -keypass "NursingApp@2025" \
              -dname "CN=Nursing Officer Prep, OU=Education, O=Nursing Officer Academy, L=Mumbai, ST=Maharashtra, C=IN"

            sed -i "s/MYAPP_UPLOAD_STORE_PASSWORD=.*/MYAPP_UPLOAD_STORE_PASSWORD=NursingApp@2025/" android/gradle.properties
            sed -i "s/MYAPP_UPLOAD_KEY_ALIAS=.*/MYAPP_UPLOAD_KEY_ALIAS=upload/" android/gradle.properties
            sed -i "s/MYAPP_UPLOAD_KEY_PASSWORD=.*/MYAPP_UPLOAD_KEY_PASSWORD=NursingApp@2025/" android/gradle.properties
          fi

          test -f android/app/upload-keystore.jks

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Gradle environment
        working-directory: android
        run: ./gradlew --version

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          ls -lah android/app/build/outputs/bundle/release/
          test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Rename AAB
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab              android/app/build/outputs/bundle/release/Nursing-Officer-Play-Store.aab

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nursing-Officer-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/Nursing-Officer-Play-Store.aab
          if-no-files-found: error

      - name: Upload Keystore Backup (.jks)
        uses: actions/upload-artifact@v4
        with:
          name: Nursing-Officer-Upload-Keystore
          path: android/app/upload-keystore.jks
          if-no-files-found: warn
