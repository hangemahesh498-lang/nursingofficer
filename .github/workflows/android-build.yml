name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Java version
        run: |
          java -version
          javac -version

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Generate App Launcher Icons & Android Assets
        run: npm run generate-icons

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Gradle environment
        working-directory: android
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare and rename APK artifact
        run: |
          ls -lah android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Nursing-Officer.apk
          ls -lah android/app/build/outputs/apk/debug/Nursing-Officer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nursing-Officer-apk
          path: android/app/build/outputs/apk/debug/Nursing-Officer.apk
          if-no-files-found: error
